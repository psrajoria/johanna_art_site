# Runs the whole site: the Django app plus Caddy, which gets and renews the
# HTTPS certificate automatically. See docs/DEPLOY.md.
services:
  web:
    build: ../src
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
      PRIVATE_MEDIA_ROOT: /data/private_media
    volumes:
      - data:/data
      - ./backups:/backups
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/robots.txt').status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - data:/srv/site:ro          # uploaded artwork images (public /media/ only)
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
