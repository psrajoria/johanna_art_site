{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Check your inbox" %}{% endblock %}

{% block content %}
<section class="section">
    <div class="shell">
        <div class="card card-pad form-card">
            <h1 class="h2">{% trans "Check your inbox" %}</h1>
            <p>{% trans "If an account exists for that email, a reset link is on its way." %}</p>
            <p><a class="btn btn--ghost" href="{% url 'shop:login' %}">{% trans "Back to log in" %}</a></p>
        </div>
    </div>
</section>
{% endblock %}
