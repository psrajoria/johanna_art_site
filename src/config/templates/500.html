<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>The paint spilled · Johanna Lackner</title>
    <!-- Self-contained on purpose: this page must work even when the database or templates do not. -->
    <script>
        try {
            var t = localStorage.getItem("jl-theme");
            if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
    </script>
    <style>
        @font-face { font-family: "Fraunces"; src: url("/static/fonts/fraunces-latin-wght-italic.woff2") format("woff2"); font-weight: 100 900; font-style: italic; font-display: swap; }
        @font-face { font-family: "Fraunces"; src: url("/static/fonts/fraunces-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
        @font-face { font-family: "DM Sans"; src: url("/static/fonts/dm-sans-latin-wght-normal.woff2") format("woff2"); font-weight: 100 1000; font-display: swap; }
        @font-face { font-family: "Caveat"; src: url("/static/fonts/caveat-latin-wght-normal.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
        :root { --paper: #fbf7f0; --ink: #2a2420; --ink2: #5a4f47; --accent: #c4553b; --rose: #e8a5a0; --ochre: #e3a93b; --blue: #5b83a8; --sage: #86a98b; color-scheme: light; }
        @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #16120f; --ink: #f1e9dc; --ink2: #cbbfae; color-scheme: dark; } }
        :root[data-theme="dark"] { --paper: #16120f; --ink: #f1e9dc; --ink2: #cbbfae; color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; overflow-x: hidden;
               background: var(--paper); color: var(--ink); font-family: "DM Sans", system-ui, sans-serif; line-height: 1.6; text-align: center; }
        main { max-width: 34rem; }
        .art { position: relative; display: grid; place-items: center; max-width: 360px; margin: 0 auto 0.5rem; }
        .art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .a { fill: var(--rose); opacity: .55; animation: in 1s cubic-bezier(.2,.8,.2,1) both; transform-origin: 50% 50%; }
        .b { fill: var(--ochre); opacity: .55; animation: in 1.1s .15s cubic-bezier(.2,.8,.2,1) both; transform-origin: 50% 50%; }
        .d { fill: var(--blue); opacity: .6; animation: in .6s .8s both; transform-origin: 50% 50%; }
        .d2 { fill: var(--sage); animation-delay: .95s; }
        .code { position: relative; font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: clamp(5rem, 20vw, 9rem); line-height: 1.6; color: var(--accent); }
        h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: clamp(1.8rem, 5vw, 2.8rem); line-height: 1.15; margin: 0 0 1rem; }
        p { margin: 0 auto 1rem; color: var(--ink2); }
        .hand { font-family: "Caveat", cursive; font-size: 1.4rem; color: var(--ink2); opacity: .85; }
        .btn { display: inline-block; margin-top: .6rem; padding: .8rem 1.6rem; border-radius: 999px; background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 600; transition: transform .2s; }
        .btn:hover { transform: translateY(-2px); }
        @keyframes in { from { opacity: 0; transform: scale(.4) rotate(-12deg); } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
</head>
<body>
    <main>
        <div class="art" aria-hidden="true">
            <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
                <path class="a" d="M70 150c-10-60 50-110 120-100s150 20 160 90-40 120-120 120S80 220 70 150Z"/>
                <path class="b" d="M120 120c20-40 90-60 130-30s50 80 10 110-110 20-130-20 -30-30-10-60Z"/>
                <circle class="d" cx="330" cy="70" r="9"/>
                <circle class="d d2" cx="70" cy="240" r="6"/>
            </svg>
            <div class="code">500</div>
        </div>
        <h1>The paint spilled.</h1>
        <p>Something went wrong on our side. Please try again in a moment — it is probably already being cleaned up.</p>
        <p class="hand">Etwas ist schiefgelaufen. Bitte versuche es gleich noch einmal.</p>
        <a class="btn" href="/">Back to the start · Zur Startseite</a>
    </main>
</body>
</html>
